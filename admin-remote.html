<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GestiónPro - Admin Remote</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg-page: #0a0e1a;
    --bg-card: #131829;
    --bg-card-soft: #0f1424;
    --border: #232a3f;
    --border-soft: #1a2035;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent-blue: #3b82f6;
    --accent-purple: #a855f7;
    --accent-pink: #ec4899;
    --accent-cyan: #06b6d4;
    --accent-green: #10b981;
    --accent-emerald: #14b8a6;
    --accent-red: #ef4444;
    --accent-amber: #f59e0b;
}
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: var(--bg-page); color: var(--text-primary); min-height: 100vh; }

.admin-bar {
    background: linear-gradient(135deg, #7f1d1d, #991b1b);
    border-bottom: 2px solid var(--accent-red);
    color: white; padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    position: sticky; top: 0; z-index: 9999;
}
.admin-bar-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.admin-bar-title h3 { font-size: 0.9rem; font-weight: 700; }
.admin-bar-title .plan-chip { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; letter-spacing: 0.4px; }
.plan-chip.premium { background: linear-gradient(135deg,#f59e0b,#d97706); color: #1a1200; }
.plan-chip.restaurant { background: linear-gradient(135deg,#3b82f6,#2563eb); color: white; }
.plan-chip.free { background: rgba(255,255,255,0.15); color: white; }
.admin-bar-actions { display: flex; gap: 8px; align-items: center; }
.admin-bar-actions button { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.25); padding: 7px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.78rem; display: flex; align-items: center; gap: 5px; transition: background 0.15s; }
.admin-bar-actions button:hover { background: rgba(255,255,255,0.28); }
.admin-bar-actions button.btn-close-remote { background: white; color: #991b1b; }

.section { padding: 24px 20px; max-width: 1080px; margin: 0 auto; }

.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.card h3 { color: var(--text-primary); margin-bottom: 14px; font-size: 1rem; display: flex; align-items: center; gap: 8px; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--bg-card-soft); border: 1px solid var(--border-soft); border-left: 3px solid var(--stat-color, var(--accent-blue)); border-radius: 12px; padding: 14px 16px; }
.stat .stat-icon { font-size: 0.95rem; margin-bottom: 6px; opacity: 0.9; }
.stat .value { font-size: 1.35rem; font-weight: 800; color: var(--text-primary); font-family: 'JetBrains Mono', monospace; }
.stat .label { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.3px; }

.insight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
.insight-card { background: var(--bg-card-soft); border: 1px solid var(--border-soft); border-radius: 12px; padding: 14px 16px; }
.insight-card .insight-title { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px; }
.insight-card .insight-value { font-size: 1.1rem; font-weight: 800; }
.insight-card .insight-sub { font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; }
.insight-card.warn { border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.06); }
.insight-card.warn .insight-value { color: var(--accent-amber); }
.insight-card.ok { border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.06); }
.insight-card.ok .insight-value { color: var(--accent-green); }

table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-soft); }
th { color: var(--text-secondary); font-weight: 700; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.3px; }
tr.low-stock td { background: rgba(245,158,11,0.07); }
tr.low-stock td:first-child { border-left: 2px solid var(--accent-amber); }

.loading { text-align: center; padding: 60px; color: var(--text-muted); }
.tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { padding: 9px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); transition: all 0.15s; }
.tab:hover { border-color: var(--accent-blue); color: var(--text-primary); }
.tab.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }
.tab.demo-tab.active { background: linear-gradient(135deg,#7c3aed,#6d28d9); border-color: transparent; }

.btn-action { padding: 8px 14px; border: none; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; margin-right: 8px; }
.btn-edit { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
.btn-delete { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }

.info-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-soft); font-size: 0.85rem; }
.info-row:last-child { border-bottom: none; }
.info-row .info-label { color: var(--text-muted); }
.info-row .info-value { color: var(--text-primary); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.copy-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary); border-radius: 6px; padding: 3px 8px; font-size: 0.7rem; cursor: pointer; }
.copy-btn:hover { color: var(--text-primary); border-color: var(--accent-blue); }
</style>
</head>
<body>
<div class="admin-bar">
    <div class="admin-bar-title">
        <h3>🛡️ ADMIN REMOTO — <span id="remote-user-name">Cargando...</span></h3>
        <span id="remote-plan-chip" class="plan-chip free" style="display:none;"></span>
    </div>
    <div class="admin-bar-actions">
        <button onclick="loadUserData()" title="Volver a cargar los datos">🔄 Actualizar</button>
        <button onclick="copyUid()" title="Copiar UID">📋 Copiar UID</button>
        <button class="btn-close-remote" onclick="window.close()">✕ Cerrar</button>
    </div>
</div>

<div class="section">
    <div class="tabs" id="tabs">
        <div class="tab active" onclick="showTab('overview')">📊 Resumen</div>
        <div class="tab" onclick="showTab('products')">📦 Productos</div>
        <div class="tab" onclick="showTab('sales')">💰 Ventas</div>
        <div class="tab" onclick="showTab('expenses')">💸 Gastos</div>
        <div class="tab" onclick="showTab('mesas')">🪑 Mesas</div>
        <div class="tab" onclick="showTab('employees')">👥 Empleados</div>
        <div class="tab" onclick="showTab('settings')">⚙️ Config</div>
        <div class="tab demo-tab" onclick="showTab('demo')">🧪 Demo</div>
    </div>

    <div id="content">
        <div class="loading">Cargando datos del usuario...</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const ADMIN_EMAILS = ['kalethcano0216@gmail.com'];
const params = new URLSearchParams(window.location.search);
const targetUid = params.get('uid');

let userData = {};
let products = [];
let sales = [];
let employees = [];
let mesas = [];
let expenses = [];
let orders = [];

auth.onAuthStateChanged(async (user) => {
    if (!user || !ADMIN_EMAILS.includes(user.email.toLowerCase())) {
        document.getElementById('content').innerHTML = '<p style="color:#dc2626;text-align:center;padding:40px;">⛔ Acceso denegado</p>';
        return;
    }
    if (!targetUid) {
        document.getElementById('content').innerHTML = '<p style="color:#dc2626;text-align:center;padding:40px;">No se especificó usuario</p>';
        return;
    }
    await loadUserData();
});

async function loadUserData() {
    try {
        const userDoc = await db.collection('users').doc(targetUid).get();
        userData = userDoc.exists ? userDoc.data() : {};
        document.getElementById('remote-user-name').textContent = userData.settings?.businessName || userData.businessName || userData.email || targetUid;

        const planValue = (userData.plan || userData.settings?.plan || 'free').toLowerCase();
        const planChip = document.getElementById('remote-plan-chip');
        planChip.textContent = planValue;
        planChip.className = 'plan-chip ' + (['premium','restaurant'].includes(planValue) ? planValue : 'free');
        planChip.style.display = 'inline-block';

        const [prodSnap, salesSnap, empSnap, mesasSnap, expSnap, ordersSnap] = await Promise.all([
            db.collection('users').doc(targetUid).collection('products').get(),
            db.collection('users').doc(targetUid).collection('sales').get(),
            db.collection('users').doc(targetUid).collection('employees').get(),
            db.collection('users').doc(targetUid).collection('mesas').get(),
            db.collection('users').doc(targetUid).collection('expenses').get(),
            db.collection('users').doc(targetUid).collection('orders').get()
        ]);

        products = prodSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        sales = salesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        sales.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        employees = empSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        mesas = mesasSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        expenses = expSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        orders = ordersSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(o => o.status !== 'completed');

        showTab('overview');
    } catch (e) {
        document.getElementById('content').innerHTML = `<p style="color:#dc2626;padding:40px;">Error: ${e.message}</p>`;
    }
}

function showTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    const activeTab = document.querySelector(`.tab[onclick*="'${tab}'"]`);
    if (activeTab) activeTab.classList.add('active');

    const content = document.getElementById('content');

    if (tab === 'overview') {
        const totalSales = sales.reduce((s, v) => s + (v.total || 0), 0);
        const totalProfit = sales.reduce((s, v) => s + (v.profit || 0), 0);
        const totalExpenses = expenses.reduce((s, e) => s + (e.amount || 0), 0);
        const planValue = (userData.plan || userData.settings?.plan || 'free');

        const todayStr = new Date().toISOString().split('T')[0];
        const salesToday = sales.filter(s => (s.date || '').startsWith(todayStr));
        const totalToday = salesToday.reduce((s, v) => s + (v.total || 0), 0);
        const avgTicket = sales.length ? totalSales / sales.length : 0;
        const lowStockProducts = products.filter(p => (p.quantity ?? 0) <= (p.minStock ?? 0));

        content.innerHTML = `
            <div class="stat-grid">
                <div class="stat" style="--stat-color:${'var(--accent-blue)'}"><div class="stat-icon">📦</div><div class="value">${products.length}</div><div class="label">Productos</div></div>
                <div class="stat" style="--stat-color:${'var(--accent-purple)'}"><div class="stat-icon">💰</div><div class="value">${sales.length}</div><div class="label">Ventas (total)</div></div>
                <div class="stat" style="--stat-color:${'var(--accent-pink)'}"><div class="stat-icon">👥</div><div class="value">${employees.length}</div><div class="label">Empleados</div></div>
                <div class="stat" style="--stat-color:${'var(--accent-cyan)'}"><div class="stat-icon">🪑</div><div class="value">${mesas.length}</div><div class="label">Mesas</div></div>
                <div class="stat" style="--stat-color:${'var(--accent-green)'}"><div class="stat-icon">📈</div><div class="value">$${Math.round(totalSales).toLocaleString('es-CO')}</div><div class="label">Ingresos</div></div>
                <div class="stat" style="--stat-color:${'var(--accent-emerald)'}"><div class="stat-icon">✅</div><div class="value">$${Math.round(totalProfit).toLocaleString('es-CO')}</div><div class="label">Ganancia</div></div>
                <div class="stat" style="--stat-color:${'var(--accent-red)'}"><div class="stat-icon">💸</div><div class="value">$${Math.round(totalExpenses).toLocaleString('es-CO')}</div><div class="label">Gastos</div></div>
                <div class="stat" style="--stat-color:${'var(--accent-amber)'}"><div class="stat-icon">⭐</div><div class="value" style="text-transform:capitalize;">${esc(planValue)}</div><div class="label">Plan</div></div>
            </div>

            <div class="insight-grid">
                <div class="insight-card ok">
                    <div class="insight-title">📅 Ventas de hoy</div>
                    <div class="insight-value">$${Math.round(totalToday).toLocaleString('es-CO')}</div>
                    <div class="insight-sub">${salesToday.length} venta${salesToday.length === 1 ? '' : 's'} registrada${salesToday.length === 1 ? '' : 's'} hoy</div>
                </div>
                <div class="insight-card">
                    <div class="insight-title">🎟️ Ticket promedio</div>
                    <div class="insight-value">$${Math.round(avgTicket).toLocaleString('es-CO')}</div>
                    <div class="insight-sub">Sobre ${sales.length} venta${sales.length === 1 ? '' : 's'} en total</div>
                </div>
                <div class="insight-card ${lowStockProducts.length ? 'warn' : 'ok'}">
                    <div class="insight-title">⚠️ Stock bajo</div>
                    <div class="insight-value">${lowStockProducts.length}</div>
                    <div class="insight-sub">${lowStockProducts.length ? esc(lowStockProducts.slice(0,3).map(p=>p.name).join(', ')) + (lowStockProducts.length > 3 ? '…' : '') : 'Todo el inventario en orden'}</div>
                </div>
            </div>

            <div class="card"><h3>📋 Info del negocio</h3>
                <div class="info-row"><span class="info-label">Email</span><span class="info-value">${esc(userData.email || '-')}</span></div>
                <div class="info-row"><span class="info-label">Negocio</span><span class="info-value">${esc(userData.settings?.businessName || '-')}</span></div>
                <div class="info-row"><span class="info-label">Moneda</span><span class="info-value">${esc(userData.settings?.currency || 'COP')}</span></div>
                <div class="info-row"><span class="info-label">Estado de cuenta</span><span class="info-value">
                    ${userData.blocked ? '<span style="color:var(--accent-red);">🔒 Bloqueada</span>' : '<span style="color:var(--accent-green);">✅ Activa</span>'}
                    <button class="copy-btn" onclick="toggleBlockAccount()">${userData.blocked ? 'Desbloquear' : 'Bloquear'}</button>
                </span></div>
                <div class="info-row"><span class="info-label">UID</span><span class="info-value"><code style="font-size:0.75rem;color:var(--text-muted);">${targetUid}</code><button class="copy-btn" onclick="copyUid()">📋 Copiar</button></span></div>
            </div>

            <div class="card"><h3>📝 Notas internas (solo tú las ves)</h3>
                <textarea id="admin-notes-input" placeholder="Ej: reportó bug con impresora el 3/sep, pidió factura..." style="width:100%;min-height:90px;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card-soft);color:var(--text-primary);font-family:inherit;font-size:0.85rem;resize:vertical;margin-bottom:10px;">${esc(userData.adminNotes || '')}</textarea>
                <button class="btn-action btn-edit" onclick="saveAdminNotes()">💾 Guardar nota</button>
            </div>`;
    } else if (tab === 'products') {
        content.innerHTML = `<div class="card"><h3>📦 Productos (${products.length})</h3>
            <div style="margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;">
                <button class="btn-action btn-edit" onclick="exportProductsCSV()">📥 Exportar CSV</button>
                <button class="btn-action btn-edit" onclick="exportProductsCarta()">📋 Exportar Carta</button>
                <button class="btn-action btn-edit" onclick="printCarta()">🖨️ Imprimir Carta</button>
            </div>
            <table><thead><tr><th>Nombre</th><th>Categoría</th><th>Stock</th><th>Costo</th><th>Precio</th><th>Acción</th></tr></thead>
            <tbody>${products.map(p => `<tr class="${(p.quantity ?? 0) <= (p.minStock ?? 0) ? 'low-stock' : ''}">
                <td>${esc(p.name)}</td><td>${esc(p.category || '-')}</td><td>${p.quantity}${(p.quantity ?? 0) <= (p.minStock ?? 0) ? ' ⚠️' : ''}</td>
                <td>$${Math.round(p.cost || 0).toLocaleString('es-CO')}</td>
                <td>$${Math.round(p.price || 0).toLocaleString('es-CO')}</td>
                <td><button class="btn-action btn-edit" onclick="openEditProduct('${p.id}')">✏️</button> <button class="btn-action btn-delete" onclick="deleteRemoteDoc('products','${p.id}','${esc(p.name)}')">🗑️</button></td>
            </tr>`).join('')}</tbody></table></div>`;
    } else if (tab === 'expenses') {
        const totalExp = expenses.reduce((s, e) => s + (e.amount || 0), 0);
        content.innerHTML = `<div class="card"><h3>💸 Gastos (${expenses.length}) — Total: $${Math.round(totalExp).toLocaleString('es-CO')}</h3>
            <table><thead><tr><th>Concepto</th><th>Categoría</th><th>Monto</th><th>Fecha</th><th>Acción</th></tr></thead>
            <tbody>${expenses.map(e => `<tr>
                <td>${esc(e.concept || '-')}</td><td>${esc(e.category || '-')}</td>
                <td>$${Math.round(e.amount || 0).toLocaleString('es-CO')}</td>
                <td>${esc(e.date || '-')}</td>
                <td><button class="btn-action btn-delete" onclick="deleteRemoteDoc('expenses','${e.id}','${esc(e.concept || 'gasto')}')">🗑️</button></td>
            </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">Sin gastos registrados</td></tr>'}</tbody></table></div>`;
    } else if (tab === 'mesas') {
        content.innerHTML = `<div class="card"><h3>🪑 Mesas (${mesas.length}) y pedidos activos (${orders.length})</h3>
            <table><thead><tr><th>Mesa</th><th>Estado</th><th>Capacidad</th></tr></thead>
            <tbody>${mesas.map(m => {
                const mesaOrders = orders.filter(o => o.mesaId === m.id);
                const total = mesaOrders.reduce((s,o) => s + (o.items||[]).reduce((s2,i)=>s2+(i.price*i.qty),0), 0);
                const ocupada = mesaOrders.length > 0;
                return `<tr class="${ocupada ? 'low-stock' : ''}">
                <td>${esc(m.name)}</td>
                <td>${ocupada ? `🟠 Ocupada — ${mesaOrders.length} tanda${mesaOrders.length===1?'':'s'} — $${Math.round(total).toLocaleString('es-CO')}` : '🟢 Libre'}</td>
                <td>${m.capacity || '-'} personas</td>
            </tr>`;}).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--text-muted);">Sin mesas configuradas</td></tr>'}</tbody></table>
            ${orders.length ? `<h3 style="margin-top:20px;">🧾 Detalle de pedidos activos</h3>${orders.map(o => `
                <div class="insight-card" style="margin-bottom:10px;">
                    <div class="insight-title">${esc(o.mesaName || o.mesaId)} ${o.tandaNumber ? '· Tanda #'+o.tandaNumber : ''} — ${esc(o.status)}</div>
                    <div class="insight-sub">${(o.items||[]).map(i => `${i.qty}× ${esc(i.name)}`).join(', ')}</div>
                </div>`).join('')}` : ''}
            </div>`;
    } else if (tab === 'sales') {
        const today = new Date().toISOString().split('T')[0];
        content.innerHTML = `<div class="card"><h3>💰 Ventas (${sales.length} total)</h3>
            <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;">
                <input type="date" id="admin-sales-date" value="" onchange="filterAdminSales()" style="padding:8px 12px;border:1px solid #334155;border-radius:8px;background:#0a0e1a;color:#e2e8f0;font-size:0.85rem;">
                <button onclick="document.getElementById('admin-sales-date').value='';filterAdminSales()" class="btn-action btn-edit">Ver todas</button>
                <span id="admin-sales-count" style="color:#94a3b8;font-size:0.85rem;"></span>
            </div>
            <div id="admin-sales-table"></div></div>`;
        filterAdminSales();
    } else if (tab === 'employees') {
        content.innerHTML = `<div class="card"><h3>➕ Agregar empleado</h3>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
                <div><label style="display:block;font-size:0.7rem;color:var(--text-muted);margin-bottom:4px;">Nombre</label>
                    <input id="new-emp-name" placeholder="Ej: Laura" style="padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card-soft);color:var(--text-primary);font-size:0.85rem;"></div>
                <div><label style="display:block;font-size:0.7rem;color:var(--text-muted);margin-bottom:4px;">Rol</label>
                    <select id="new-emp-role" style="padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card-soft);color:var(--text-primary);font-size:0.85rem;">
                        <option value="owner">Dueño</option><option value="caja" selected>Caja</option><option value="waiter">Mesero</option>
                    </select></div>
                <div><label style="display:block;font-size:0.7rem;color:var(--text-muted);margin-bottom:4px;">PIN (4 dígitos)</label>
                    <input id="new-emp-pin" placeholder="1234" maxlength="6" style="padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card-soft);color:var(--text-primary);font-size:0.85rem;width:90px;"></div>
                <button class="btn-action btn-edit" onclick="addRemoteEmployee()">➕ Agregar</button>
            </div>
        </div>
        <div class="card"><h3>👥 Empleados (${employees.length})</h3>

async function deleteRemoteDoc(collection, docId, name) {
    try {
        await db.collection('users').doc(targetUid).collection(collection).doc(docId).delete();
        showNotice(`"${name}" eliminado`);
        await loadUserData();
    } catch (e) { showNotice('Error: ' + e.message); }
}

async function resetUserSettings() {
    if (!confirm('¿Resetear TODOS los ajustes de este negocio a los valores por defecto? Esto no se puede deshacer.')) return;
    try {
        await db.collection('users').doc(targetUid).update({
            settings: { businessName: userData.settings?.businessName || 'Mi Negocio', currency: 'COP', defaultTax: 19, defaultMargin: 30, theme: 'light', monthlyGoal: 0 }
        });
        showNotice('Settings reseteados');
        await loadUserData();
    } catch (e) { showNotice('Error: ' + e.message); }
}

async function changeUserPlan() {
    const plan = document.getElementById('cfg-plan-select').value;

    try {
        await db.collection('users').doc(targetUid).update({ plan: plan, 'settings.plan': plan });

async function clearUserSales() {
    if (!confirm('¿Borrar TODAS las ventas de este usuario?')) return;
    try {
        const snap = await db.collection('users').doc(targetUid).collection('sales').get();
        const batch = db.batch();
        snap.docs.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
        showNotice('Ventas borradas');
        await loadUserData();
    } catch (e) { showNotice('Error: ' + e.message); }
}

function filterAdminSales() {
    const dateFilter = document.getElementById('admin-sales-date')?.value || '';
    let filtered = sales;
    if (dateFilter) {
        filtered = sales.filter(s => s.date && s.date.startsWith(dateFilter));
    }
    const total = filtered.reduce((s, v) => s + (v.total || 0), 0);
    const countEl = document.getElementById('admin-sales-count');
    if (countEl) countEl.textContent = `${filtered.length} ventas — Total: $${Math.round(total).toLocaleString('es-CO')}`;
    const container = document.getElementById('admin-sales-table');
    if (!container) return;
    container.innerHTML = `<table><thead><tr><th>Fecha</th><th>Producto</th><th>Cant</th><th>Total</th><th>Método</th><th>Vendió</th></tr></thead>
        <tbody>${filtered.map(s => `<tr>
            <td>${new Date(s.date).toLocaleDateString('es-CO', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
            <td>${esc(s.productName || '-')}</td><td>${s.quantity}</td>
            <td>$${Math.round(s.total || 0).toLocaleString('es-CO')}</td>
            <td>${esc(s.method || '-')}</td>
            <td>${esc(s.soldBy || '-')}</td>
        </tr>`).join('')}</tbody></table>`;
}

function exportProductsCSV() {
    const businessName = userData.settings?.businessName || userData.businessName || 'Negocio';
    const headers = ['Producto', 'Categoría', 'Precio', 'Descripción'];
    const rows = products.map(p => [p.name, p.category || '', '$' + Math.round(p.price || 0).toLocaleString('es-CO'), p.description || '']);
    const csv = [headers, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
    const blob = new Blob([`\uFEFF${csv}`], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `productos-${businessName.replace(/\s+/g, '-')}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showNotice('CSV exportado');
}

function exportProductsCarta() {
    const businessName = userData.settings?.businessName || userData.businessName || 'Restaurante';
    const categories = {};
    products.forEach(p => {
        if (!categories[p.category]) categories[p.category] = [];
        categories[p.category].push(p);
    });

    let text = `═══════════════════════════════\n`;
    text += `   ${businessName.toUpperCase()}\n`;
    text += `   CARTA DE PRODUCTOS\n`;
    text += `═══════════════════════════════\n\n`;

    Object.entries(categories).sort((a, b) => a[0].localeCompare(b[0])).forEach(([cat, items]) => {
        text += `── ${cat.toUpperCase()} ──\n`;
        items.sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
            const price = '$' + Math.round(p.price || 0).toLocaleString('es-CO');
            const desc = p.description ? `  (${p.description})` : '';
            text += `  ${p.name}${desc}\n`;
            text += `    ${price}\n`;
        });
        text += `\n`;
    });

    text += `═══════════════════════════════\n`;
    text += `  Restaurante aliado GestiónPro\n`;

    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `carta-${businessName.replace(/\s+/g, '-')}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    showNotice('Carta exportada');
}

function copyUid() {

function showNotice(msg) {
    const n = document.createElement('div');
    n.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:12px 24px;border-radius:10px;font-size:0.9rem;z-index:9999;border:1px solid #334155;';
    n.textContent = msg;
    document.body.appendChild(n);
    setTimeout(() => n.remove(), 3000);
}

function generateId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2,9); }

async function hashPinAdmin(pin) {
    const encoder = new TextEncoder();
    const data = encoder.encode(pin + '_gestionpro_salt');
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}
